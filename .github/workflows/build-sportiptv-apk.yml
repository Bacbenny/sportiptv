name: Build SportIPTV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Android project
        working-directory: artifacts/sports-iptv-player
        run: CI=1 pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: artifacts/sports-iptv-player/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sportiptv-v1.0.${{ github.run_number }}
          name: SportIPTV v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: artifacts/sports-iptv-player/android/app/build/outputs/apk/release/app-release.apk